<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6 - Galeria Grid e Flexbox</title>
    <link rel="stylesheet" href="../04/styles.css">
    <style>
        .flex-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .galeria-grid figure {
            margin: 0;
            background: #f4f4f4;
            border: 2px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .galeria-grid img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }
        @media (max-width: 900px) {
            .galeria-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .galeria-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="galeria-grid">
            <figure>
                <img src="https://picsum.photos/id/1011/300/200" alt="Imagem 1">
                <figcaption>Paisagem 1</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1012/300/200" alt="Imagem 2">
                <figcaption>Paisagem 2</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1013/300/200" alt="Imagem 3">
                <figcaption>Paisagem 3</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1015/300/200" alt="Imagem 4">
                <figcaption>Paisagem 4</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1016/300/200" alt="Imagem 5">
                <figcaption>Paisagem 5</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1018/300/200" alt="Imagem 6">
                <figcaption>Paisagem 6</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1020/300/200" alt="Imagem 7">
                <figcaption>Paisagem 7</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1021/300/200" alt="Imagem 8">
                <figcaption>Paisagem 8</figcaption>
            </figure>
        </div>
    </div>
</body>
</html>
